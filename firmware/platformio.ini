; RetroRadio firmware for Sonocotta HiFi-ESP32 (ESP32-WROVER-IE, 8MB flash/8MB PSRAM, PCM5100A)
[platformio]
default_envs = usb
extra_configs = secrets.ini

[env]
; pioarduino = Arduino-ESP32 core 3.x (needed by ESP32-audioI2S)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#56f2791
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^7.2.0
; Overseas streams need a bigger TCP receive window: throughput <= window / RTT,
; and the stock 5760 B at ~210 ms RTT caps out at ~27 kB/s (a 320k stream needs 40).
; lwIP/WiFi buffers go to PSRAM so internal heap isn't eaten. (Triggers a framework rebuild.)
custom_sdkconfig =
    CONFIG_LWIP_TCP_WND_DEFAULT=32768
    CONFIG_LWIP_TCP_RECVMBOX_SIZE=32
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    ; esp32dev doesn't declare PSRAM, so the rebuild drops it: restore the stock libs' settings
    CONFIG_SPIRAM=y
    CONFIG_SPIRAM_SUPPORT=y
    CONFIG_ESP32_SPIRAM_SUPPORT=y
    CONFIG_SPIRAM_TYPE_AUTO=y
    CONFIG_SPIRAM_MODE_QUAD=y
    CONFIG_SPIRAM_SPEED_80M=y
    CONFIG_SPIRAM_USE_MALLOC=y
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
    CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=0
    CONFIG_SPIRAM_CACHE_WORKAROUND=y
    CONFIG_SPIRAM_CACHE_WORKAROUND_STRATEGY_MEMW=y
    CONFIG_SPIRAM_BANKSWITCH_ENABLE=y
    CONFIG_SPIRAM_BANKSWITCH_RESERVE=8
    CONFIG_SPIRAM_OCCUPY_HSPI_HOST=y
    CONFIG_ESP32_ECO3_CACHE_LOCK_FIX=y
    CONFIG_STDATOMIC_S32C1I_SPIRAM_WORKAROUND=y
    CONFIG_D0WD_PSRAM_CLK_IO=17
    CONFIG_D0WD_PSRAM_CS_IO=16
    ; stock libs are built for 80 MHz QIO flash; PSRAM can only run at 80 MHz if flash
    ; does. (The image header still says DIO 40m from the board, as it always has.)
    CONFIG_ESPTOOLPY_FLASHMODE_QIO=y
    CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; first flash / recovery over the USB cable
[env:usb]
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_speed = 921600

; everyday updates over WiFi:  pio run -e ota -t upload
[env:ota]
upload_protocol = espota
upload_port = retroradio.local
upload_flags = --auth=${ota.password}
